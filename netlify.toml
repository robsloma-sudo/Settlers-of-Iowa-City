[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

# phones must always fetch the newest page (it links the newest game files)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
