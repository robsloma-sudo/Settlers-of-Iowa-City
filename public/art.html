<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Artwork · Settlers of Iowa City</title>
<link rel="stylesheet" href="style.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: #fff; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line); }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #ddd; }
  .tile .meta { padding: 6px 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .tile .meta b { flex: 1; text-transform: capitalize; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; background: #e8dcba; }
  .tag.ai { background: var(--gold); }
  .err { color: var(--bad); font-size: 12px; padding: 0 8px 8px; }
  .state { font-weight: 700; }
</style>
</head>
<body>
<div class="home">
  <div class="brand"><h1>Settlers of <span>Iowa City</span></h1><p>Artwork studio</p></div>
  <div class="card stack">
    <h2>Realistic art from OpenAI</h2>
    <div class="hint">Makes photo-realistic tiles with OpenAI's image model, through your Netlify account's AI Gateway. It takes about 1–3 minutes. Games switch to the new art automatically; anyone already playing sees it after a refresh.</div>
    <div id="state" class="state">Checking…</div>
    <button class="primary wide" id="go">Generate all with OpenAI</button>
    <button class="ghost wide" id="reset">Go back to the hand-made art</button>
  </div>
  <div class="card"><div class="grid" id="grid"></div></div>
</div>
<div id="toast"></div>
<script>
const key = new URLSearchParams(location.search).get('key') || '';
const NAMES = ['wool', 'grain', 'brick', 'lumber', 'ore', 'desert', 'sea', 'table'];
const LABEL = { wool: 'Pasture (wool)', grain: 'Sweet corn field (corn)', brick: 'Hills (brick)', lumber: 'Forest (lumber)', ore: 'Mountains (ore)', desert: 'Desert', sea: 'Sea', table: 'Tabletop' };
const $ = s => document.querySelector(s);
let S = null, timer;
function toast(m) { const d = document.createElement('div'); d.textContent = m; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3500); }
async function load() {
  clearTimeout(timer);
  try { S = await (await fetch('/art-api/status?key=' + encodeURIComponent(key), { cache: 'no-store' })).json(); } catch (e) { $('#state').textContent = 'Could not reach the site.'; return; }
  if (!key || !('errors' in S)) { $('#state').textContent = 'This page needs your private art link.'; $('#go').disabled = $('#reset').disabled = true; }
  else {
    const running = S.state === 'running';
    const errs = Object.keys(S.errors || {});
    $('#state').textContent = running ? `Painting with OpenAI… ${S.done.length} finished so far.` :
      S.state === 'done' ? `Done${S.model ? ' · made with ' + S.model : ''}.${errs.length ? ' Some failed — tap Redo on those.' : ''}` :
      S.state === 'error' ? 'It did not work: ' + (S.errors.all || Object.values(S.errors)[0] || 'unknown error') : 'Ready.';
    $('#go').disabled = running;
    if (running) timer = setTimeout(load, 3000);
  }
  $('#grid').innerHTML = NAMES.map(n => {
    const ai = S.images && S.images[n];
    const src = ai ? `/ai-art/${n}?v=${ai}` : `/art/${n}.jpg?v=3`;
    const err = S.errors && S.errors[n];
    return `<div class="tile"><img src="${src}" alt="${LABEL[n]}"><div class="meta"><b>${LABEL[n]}</b><span class="tag ${ai ? 'ai' : ''}">${ai ? 'OpenAI' : 'Hand-made'}</span></div>
      <div class="meta"><button class="small" data-redo="${n}" ${key ? '' : 'disabled'}>${ai ? 'Redo' : 'Make'}</button>${ai ? `<button class="small ghost" data-undo="${n}">Use hand-made</button>` : ''}</div>${err ? `<div class="err">${err.replace(/</g, '&lt;')}</div>` : ''}</div>`;
  }).join('');
}
async function generate(only) {
  await fetch('/art-api/generate?key=' + encodeURIComponent(key) + (only ? '&only=' + only : ''), { method: 'POST' });
  toast('Started — this takes a minute or two.');
  setTimeout(load, 1500);
}
async function reset(only) {
  const r = await fetch('/art-api/reset?key=' + encodeURIComponent(key) + (only ? '&only=' + only : ''), { method: 'POST' });
  toast(r.ok ? 'Switched back to the hand-made art.' : 'Not allowed.'); load();
}
$('#go').onclick = () => generate();
$('#reset').onclick = () => { if (confirm('Remove the OpenAI art and go back to the hand-made art?')) reset(); };
document.addEventListener('click', e => {
  const r = e.target.closest('[data-redo]'), u = e.target.closest('[data-undo]');
  if (r) generate(r.dataset.redo); if (u) reset(u.dataset.undo);
});
load();
</script>
</body>
</html>
